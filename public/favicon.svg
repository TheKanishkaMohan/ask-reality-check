<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    .theme-light { display: block; }
    .theme-dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .theme-light { display: none; }
      .theme-dark { display: block; }
    }
  </style>
  <image class="theme-light" href="data:image/png;base64," width="512" height="512"/>
  <image class="theme-dark" href="data:image/png;base64," width="512" height="512"/>
</svg>